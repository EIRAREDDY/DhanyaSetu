spring.application.name=dhanyasetu-backend
server.port=8080

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dhanyasetu?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:dhanyasetu-super-secret-key-change-in-production-min-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.dhanyasetu=INFO
